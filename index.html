<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    
    <link rel="stylesheet" href="./style.css">
</head>
<body class="blue-bg">
    <dialog class="player-registration">
        <form class="playersForm">
            <label for="player1">Player One Name(X):</label>
            <input type="text" id="player1" name="player1-name" value="Player1">
            <label for="player2">Player Two Name(O):</label>
            <input type="text" id="player2" name="player-name" value="Player2">
            <button type="submit" class="game-control start-btn">Start Game</button>
        </form>
    </dialog>
    <h1>Tic Tac Toe</h1>
    <main>
        <div class="players">
            <h2 class="player1"></h2>
            <h2 class="player2 active-player"></h2>
        </div>
        <div class="gameboard"></div>
    </main>

    <div class="game-conclusion">
        <div class="result"></div>
        <button class="game-control restart-btn">Restart Game</button>
    </div>
    
    
    <script src="./script.js"></script>
</body>
</html>
